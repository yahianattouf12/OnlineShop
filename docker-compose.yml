# Start everything:  docker compose up --build
# Website:           http://localhost:3000
# Swagger UI:        http://localhost:8080/swagger
# Secrets come from .env (copy .env.example to .env). .env is never committed.
services:
  web:
    build: ./web                 # React frontend, served by nginx; nginx forwards /api to the app container
    ports:
      - "3000:80"
    depends_on:
      - app

  app:
    build:
      context: .                 # the repository root, so the Dockerfile can COPY app/ and proto/
      dockerfile: app/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development  # keeps Swagger UI on for the demo
      # Inside Docker, "localhost" is this container itself. The database is reached by its service name: app-db.
      # GSS Encryption Mode=Disable: we do not use Kerberos, and without it Npgsql logs a harmless
      # "Error: libgssapi_krb5.so.2: cannot open shared object file" on every start.
      ConnectionStrings__Default: Host=app-db;Port=5432;Database=db_online_shop;Username=admin;Password=${APP_DB_PASSWORD};GSS Encryption Mode=Disable
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY in .env}
      Admin__Email: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env}
      Admin__Password: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      # The inventory service, by its service name. gRPC over plain HTTP/2 inside the Docker network.
      Inventory__Address: http://inventory:50051
      # The telemetry controller answers only in the dedicated benchmark project.
      Benchmark__Project: ${COMPOSE_PROJECT_NAME:-onlineshop}
    volumes:
      - uploads:/app/uploads     # product images survive when the container is removed
    # No depends_on for inventory on purpose: the app must start and answer clearly even when inventory is down.
    depends_on:
      app-db:
        condition: service_healthy   # wait until PostgreSQL really accepts connections

  app-db:
    image: postgres:17
    environment:
      POSTGRES_DB: db_online_shop
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
    ports:
      - "5432:5432"              # lets you run the app with "dotnet run" against this database too
    volumes:
      - app-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d db_online_shop"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Requirement 2: the inventory service, in another language (Node.js), with its own database.
  inventory:
    build:
      context: .                 # the repository root, so the Dockerfile can COPY proto/
      dockerfile: inventory/Dockerfile
    ports:
      - "50051:50051"            # lets you run the app with "dotnet run" against this service too
    environment:
      DATABASE_URL: postgres://inventory:${INVENTORY_DB_PASSWORD}@inventory-db:5432/inventory
    depends_on:
      inventory-db:
        condition: service_healthy

  inventory-db:
    image: postgres:17
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: ${INVENTORY_DB_PASSWORD:?Set INVENTORY_DB_PASSWORD in .env}
    # No ports: nothing outside Docker needs this database, only the inventory service.
    volumes:
      - inventory-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventory"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Optional: adds the demo catalog (12 products with images) through the API.
  # Not started by "docker compose up"; run it with:  docker compose --profile seed run --rm seed
  seed:
    image: node:22-alpine
    profiles: ["seed"]
    working_dir: /seed
    volumes:
      - ./seed:/seed:ro
    environment:
      API_URL: http://app:8080
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    command: ["node", "seed.mjs"]
    depends_on:
      - app

  # Requirement 3: runs the Task 3 k6 workloads and serves their results (admin only), for the
  # Performance page of the website. Not started by "docker compose up"; start it with the benchmark project:
  #   docker compose -p onlineshop-bench --profile benchmark up -d --build
  benchmark:
    build:
      context: .                 # the repository root, so the image can COPY api-tests/task3
      dockerfile: benchmark/Dockerfile
    profiles: ["benchmark"]
    ports:
      - "8090:8090"              # the benchmark API, for api-tests/7-benchmark.http
    environment:
      APP_URL: http://app:8080   # k6 calls the API inside the Docker network, not through localhost
      # Fixture writes are rejected unless this exact project is onlineshop-bench.
      BENCHMARK_PROJECT: ${COMPOSE_PROJECT_NAME:-onlineshop}
      BENCHMARK_APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      BENCHMARK_INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD}
    volumes:
      - ./task3-results:/results # the same folder the CLI scripts write, so report.mjs reads both
    depends_on:
      - app
      - inventory

volumes:
  app-db-data:
  uploads:
  inventory-db-data:
