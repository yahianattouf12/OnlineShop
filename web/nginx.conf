# Serves the built frontend and forwards API calls to the "app" container, so the browser sees one
# origin (http://localhost:3000) and the API needs no CORS settings.
server {
    listen 80;
    server_tokens off;   # no nginx version in responses or error pages

    root /usr/share/nginx/html;

    # Product images are uploaded through here: the API allows 5 MB images plus form fields.
    client_max_body_size 7m;

    # Refresh container addresses after Compose replaces the API or benchmark service.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $shop_api http://app:8080;

    # API, Swagger UI and the OpenAPI document come from the API container.
    # The API sets its own security headers on these responses.
    location /api/ {
        proxy_pass $shop_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /swagger {
        proxy_pass $shop_api;
        proxy_set_header Host $host;
    }

    location /openapi/ {
        proxy_pass $shop_api;
        proxy_set_header Host $host;
    }

    # The benchmark service (Requirement 3) runs only with the benchmark profile. Resolving its name per request
    # (Docker's DNS + a variable) lets nginx start without it; the Performance page then explains how to start it.
    location /benchmark-api/ {
        set $benchmark http://benchmark:8090;
        proxy_pass $benchmark;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;   # the read-after-write proof and run starts can take a few seconds
    }

    # Built files have a content hash in their name, so they can be cached forever.
    location /assets/ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Every other path is a page of the single-page app: always serve index.html.
    location / {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
